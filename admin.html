<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Remy الاحترافية | تطوير سامر 👑</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg: #0a1120; --card: #162136; --blue: #38bdf8; --red: #e94560; --text: #ffffff; --accent: #10b981; --gold: #f59e0b; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; width: 100%; max-width: 1150px; }
        .panel { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .admin-logo { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--blue); margin-bottom: 10px; }
        .q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 15px 0; }
        .q-btn { background: rgba(255, 255, 255, 0.05); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.3); padding: 12px 5px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: 0.3s; }
        .q-btn.active { background: var(--blue); color: #000; box-shadow: 0 0 15px var(--blue); }
        .section-title { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 15px; color: var(--blue); font-size: 1.1em; font-weight: bold; }
        #question-text-area { margin: 15px 0; font-size: 1.8em; color: #fff; font-weight: bold; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border-right: 4px solid var(--blue); min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .opt-preview { 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            padding: 6px 15px; 
            border-radius: 15px; 
            font-size: 0.7em; 
            color: #38bdf8; 
            margin: 4px; 
            display: inline-block; 
            filter: blur(6px); 
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }
        .opt-preview.revealed { filter: blur(0); background: rgba(16, 185, 129, 0.2); border-color: var(--accent); color: white; }
        
        .list-container { max-height: 400px; overflow-y: auto; text-align: right; }
        .name-item { display: flex; justify-content: space-between; padding: 10px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 0.95em; border-right: 3px solid transparent; }
        .fast-track { border-right-color: var(--accent); }
        .leader-track { border-right-color: var(--gold); }
        .btn-danger { background: var(--red); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-warning { background: var(--gold); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-celeb { background: linear-gradient(45deg, #f59e0b, #ef4444); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="right-col">
            <div class="panel" style="text-align: center;">
                <img src="logo.png" class="admin-logo" onerror="this.src='https://via.placeholder.com/70'">
                <h2 style="margin:0">لوحة تحكم Remy 👑</h2>
                <div style="margin-top: 15px; font-size: 0.9em; color: var(--blue);">السؤال المباشر الآن:</div>
                <div id="question-text-area">اختر سؤالاً من الشبكة...</div>
                <div style="color: var(--accent); font-weight: bold;">الفائز بالنقطة: <span id="winner-name">---</span></div>
            </div>
            <div class="panel">
                <div class="section-title">🎮 التحكم بالأسئلة</div>
                <div class="q-grid" id="btn-container"></div>
                <button class="btn-danger" onclick="sendQ(-1)">🛑 إيقاف وإخفاء السؤال</button>
                <button class="btn-warning" onclick="resetRound()">🔄 تصفير إجابات الأجهزة</button>
            </div>
            <button onclick="startCelebration()" class="btn-celeb">🎊 إطلاق احتفالية الفوز</button>
        </div>
        <div class="left-col">
            <div class="panel">
                <div class="section-title">⚡ أسرع 10 في السؤال الحالي</div>
                <div id="fastest-list" class="list-container"></div>
            </div>
            <div class="panel">
                <div class="section-title">🏆 المتصدرين (النقاط)</div>
                <div id="leaderboard" class="list-container"></div>
            </div>
        </div>
    </div>

    <script>
        const config = { 
            apiKey: "AIzaSyBxqfLt3o3JWy_vwnpwSQPIVdtEDGoYB6k",
            authDomain: "fawazir-jaco.firebaseapp.com",
            databaseURL: "https://fawazir-jaco-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "fawazir-jaco",
            storageBucket: "fawazir-jaco.firebasestorage.app",
            messagingSenderId: "862747657100",
            appId: "1:862747657100:web:d52ecee9373a5e33fd8ca9"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

   const myQuestions =[
  { q: "ما الحيوان الذي يُلقب بـ سفينة الصحراء؟", options: ["الحصان", "الجمل", "الفيل"] },
  { q: "ما هو الطير الذي يرمز للسلام ؟", options: ["الحمام", "النسر", "الكلب"] },
  { q: "ما هو عام الفيل؟", options: ["عام هجرة النبي", "عام ميلاد النبي ﷺ", "عام فتح مكة"] },
  { q: "ما هو العنصر الذي يمنح اللهب الأخضر لونه في الألعاب النارية؟", options: ["الصوديوم", "الباريوم", "النحاس"] },
  { q: "ما هو الحيوان الذي يمتلك أعلى عدد من القلوب؟", options: ["الحوت الأزرق", "الأخطبوط", "الزرافة"] },
  { q: "ما هو أسرع حيوان بري في العالم؟", options: ["النمر", "الفهد", "الغزال"] },
  { q: "ما هو الغاز الأكثر وفرة في الغلاف الجوي للأرض؟", options: ["الأكسجين", "ثاني أكسيد الكربون", "النيتروجين"] },
  { q: "ما هي الدولة التي تُعرف بأرض الأهرامات؟", options: ["العراق", "السودان", "مصر"] },
  { q: "ما هي العملة الرسمية في دولة اليابان؟", options: ["اليوان", "الين", "الوون"] },
  { q: "كم عدد الأنبياء الذين ذكروا في القرآن الكريم؟", options: ["20 نبياً", "25 نبياً", "30 نبياً"] },
  { q: "كم استغرق نزول القرآن الكريم على النبي ﷺ؟", options: ["20 عاماً", "23 عاماً", "25 عاماً"] },
  { q: "ما هو ناتج قسمة 64على 8 ؟", options: ["7", "8", "6"] },
  { q: "أنا أمامك دائمًا ولا تستطيع رؤيتي، أنا بداية النهاية ونهاية الزمان والمكان. ما أنا؟", options: ["الكون", "المستقبل", "الماضي"] },
  { q: "ما هو الشيء الذي يمتلك رقبة ولا يملك رأسًا، وله جسد ولا يملك أذرعًا؟", options: ["الزجاجة", "الكأس", "المزهريه"] },
  { q: "ما هو الحيوان الذي يملك لسانًا أسود؟", options: ["النعامه", "الفيل", "الزرافة"] },
  { q: "ما هي أكبر عظمة في جسم الإنسان؟", options: ["عظمة الساق", "عظمة الرقبه", "عظمة الفخذ"] },
  { q: "ما هي المادة التي تعطي النباتات لونها الأخضر؟", options: ["ثاني اكسيد الكربون", "السماد", "الكلوروفيل"] },
  { q: "الجمله الاولى المشهوره فيها الستريمر ريمي الكفو", options: ["انت كفو", "كش عليك", "طربق طربقات"] },
  { q: "في أي سنة تم إعلان توحيد المملكة العربية السعودية ؟", options: ["1902م", "1925م", "1932م"] },
  { q: "وادي في المدينة المنورة ذُكر في السيرة النبوية،؟", options: ["وادي فاطمه", "وادي حنيفة", "وادي العقيق"] },
  { q: "كم سرعة فرس النهر ؟", options: ["٣٠ كم في الساعه", "٤٠ كم في الساعه", "٦٠ كم في الساعه"] },
  { q: "من هو الحيوان الشجاع ويهابه أغلب الحيوانات ؟", options: ["الأسد", "غرير العسل", "الضبع"] },
  { q: "ماهو الشي الذي يتكلم ب جميع اللغات ؟؟", options: ["الصدى", "الصوت", "المترجم"] },
  { q: "ما هي الدولة التي لا تملك جيشا ؟", options: ["كوستريكا", "المجر", "انونيسيا"] },
  { q: "ما هو الرمز الذي يرمز له FE ؟", options: ["الذهب", "الفضه", "الحديد"] },
  { q: "ما هي الدولة التي اخترعت لعبة الشطرنج ؟", options: ["الهند", "الصين", "اليابان"] },
  { q: "من هو القائد المسلم في معركة حطين ؟", options: ["ابو بكر الصديق", "عمر بن الخطاب", "صلاح الدين الايربي"] },
  { q: "ما هو العنصر الاكثرة وفرة في الكون؟", options: ["الهيدروجين", "الحديد", "النحاس"] },
  { q: "من مؤلف رواية البؤساء؟", options: ["فكتور هوغو", "علي باشا", "ابن سينا"] },
  { q: "ما هو الرقم الذري للاوكسجين ؟", options: ["8", "7", "6"] },
  { q: "من الذي جمع القران بعد ابو بكر الصديق رضي الله عنه؟", options: ["عثمان بن عفان", "عمر بن الخطاب", "علي بن ابي طالب"] },
  { q: "ما السورة التي بدأت بـ'يا أيها الناس'؟", options: ["سورة النساء", "سورة النحل", "سورة الحجرات"] },
  { q: "ما هي السورة التي بدأت وتنتهي بالتسبيح؟", options: ["سورة الحشر", "سورة النبأ", "سورة الملك"] },
  { q: "من هو هداف الهلال التاريخي في الدوري؟", options: ["غوميز", "ياسر القحطاني", "عمر خريبين"] },
  { q: "كم عدد دول شبه الجزيرة العربية؟", options: ["٧ دول", "8دول", "9 دول"] },
  { q: "متى تأسست المملكة العربية السعودية؟", options: ["1932م", "1933م", "1950م"] },
  { q: "ما هو الحيوان الذي لا يصدر اي صوت ؟", options: ["الزرافة", "القط", "الغزال"] },
  { q: "متى وقعت الحرب العالميه الاولى ؟", options: ["1914م", "1915م", "1916م"] },
  { q: "ما هو اكبر عضو في جسم الانسان ؟", options: ["الجلد", "العظم", "الرأس"] }
];

        const container = document.getElementById("btn-container");
        for(let i=0; i<40; i++) {
            let b = document.createElement("button");
            b.className = "q-btn"; b.innerText = "س" + (i+1); b.id = "q" + i;
            b.onclick = () => sendQ(i); container.appendChild(b);
        }

        function sendQ(idx) {
            if (idx === -1) {
                db.ref('currentQuestion').set(-1);
                db.ref('questionStartTime').remove();
            } else {
                db.ref('currentQuestion').set(idx);
                db.ref('questionStartTime').set(firebase.database.ServerValue.TIMESTAMP);
            }
            db.ref('celebration').remove();
        }

        function startCelebration() { db.ref('celebration').set({ timestamp: Date.now() }); }
        
        function resetRound() {
            if(confirm("تصفير الإجابات لبدء سؤال جديد؟ (سيتم مسح سجل المحاولات أيضاً)")) {
                db.ref('roundVersion').transaction(v => (v || 0) + 1);
                db.ref('winners').remove();
                db.ref('answers_logs').remove();
                db.ref('attempts').remove(); 
                alert("تم التصفير بنجاح! 🚀");
            }
        }

        db.ref('currentQuestion').on('value', snap => {
            const idx = snap.val();
            document.querySelectorAll(".q-btn").forEach(b => b.classList.remove("active"));
            const displayArea = document.getElementById("question-text-area");

            if(idx !== -1 && idx !== null) {
                if(document.getElementById("q"+idx)) document.getElementById("q"+idx).classList.add("active");
                const qData = myQuestions[idx];
                
                let html = `<div style="margin-bottom:12px; font-size:1.1em;">${qData.q}</div><div>`;
                if(qData.options) {
                    qData.options.forEach(opt => { 
                        html += `<span class="opt-preview" onclick="this.classList.toggle('revealed')">${opt}</span>`; 
                    });
                }
                html += `</div><small style="color:gray; font-size: 0.5em; display:block; margin-top:10px;">(انقر على الخيار للكشف)</small>`;
                displayArea.innerHTML = html;

                db.ref('answers_logs/' + idx).orderByChild('timestamp').limitToFirst(10).on('value', s => {
                    const list = document.getElementById("fastest-list");
                    list.innerHTML = "";
                    if(!s.exists()) { list.innerHTML = "<p style='text-align:center; color:#666'>بانتظار الإجابات...</p>"; return; }
                    let count = 1;
                    s.forEach(child => {
                        list.innerHTML += `<div class="name-item fast-track"><span>${count}. <b>${child.val().name}</b></span><span style="color:var(--accent)">✓</span></div>`;
                        count++;
                    });
                });
                db.ref('winners/'+idx).on('value', s => { document.getElementById("winner-name").innerText = s.exists() ? s.val().name : "---"; });
            } else {
                displayArea.innerText = "المسابقة متوقفة حالياً";
                document.getElementById("fastest-list").innerHTML = "";
            }
        });

        db.ref('users').on('value', snap => {
            const data = snap.val() || {};
            const sorted = Object.values(data).sort((a,b) => (b.points || 0) - (a.points || 0)).slice(0, 10);
            const list = document.getElementById("leaderboard");
            list.innerHTML = "";
            sorted.forEach((p, i) => {
                let medal = i===0 ? "🥇 " : i===1 ? "🥈 " : i===2 ? "🥉 " : (i+1)+". ";
                list.innerHTML += `<div class="name-item leader-track"><span>${medal}<b>${p.name}</b></span><span style="color:var(--gold)">${p.points || 0} ن</span></div>`;
            });
        });
    </script>
</body>
</html>
